name: Deploy portal to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sync_services:
        description: 'Also sync all subservices (git pull/build/pm2)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: deploy-portal-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin master
            git reset --hard origin/master
            chmod +x scripts/deploy.sh
            SYNC_SERVICES="${{ github.event.inputs.sync_services == 'true' && '1' || '0' }}" ./scripts/deploy.sh
